<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Test</title>
    <style>
        body { font-family: monospace; background: #000; color: #0f0; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border: 1px solid #333; }
        .pass { color: #0f0; }
        .fail { color: #f00; }
    </style>
</head>
<body>
    <h1>Cyberpunk Oregon Trail - Game Test</h1>
    
    <div class="test-result">
        <h3>Testing Game Initialization...</h3>
        <p id="init-test">Checking if game loads properly...</p>
    </div>
    
    <div class="test-result">
        <h3>Testing Resource Management...</h3>
        <p id="resource-test">Checking resource system...</p>
    </div>
    
    <div class="test-result">
        <h3>Testing Terminal Effects...</h3>
        <p id="effects-test">Checking visual effects...</p>
    </div>
    
    <div class="test-result">
        <h3>Testing Commands...</h3>
        <p id="commands-test">Checking command system...</p>
    </div>
    
    <script>
        // Test game initialization
        try {
            // Simulate game object
            const gameState = {
                credits: 1000,
                dataChips: 50,
                energyCells: 25,
                teamMembers: [
                    { name: "ZERO", role: "Netrunner", health: 100, status: "Healthy", skill: "Hacking" },
                    { name: "SPARK", role: "Techie", health: 100, status: "Healthy", skill: "Engineering" },
                    { name: "GHOST", role: "Runner", health: 100, status: "Healthy", skill: "Stealth" },
                    { name: "DOC", role: "Medtech", health: 100, status: "Healthy", skill: "Medical" }
                ],
                distanceTraveled: 0,
                totalDistance: 2000,
                currentLocation: "Seattle Ruins",
                destination: "Neo-Tokyo Data Haven",
                gameDate: "2077.03.15",
                dayCounter: 0,
                weather: "Acid Rain",
                gameActive: true
            };
            
            document.getElementById('init-test').innerHTML = '<span class="pass">✓ Game initialization successful</span>';
            document.getElementById('init-test').innerHTML += '<br>Team: ' + gameState.teamMembers.length + ' members';
            document.getElementById('init-test').innerHTML += '<br>Starting resources: ' + gameState.credits + ' credits, ' + gameState.dataChips + ' data chips';
        } catch (e) {
            document.getElementById('init-test').innerHTML = '<span class="fail">✗ Game initialization failed: ' + e.message + '</span>';
        }
        
        // Test resource management
        try {
            let testState = { credits: 1000, dataChips: 50, energyCells: 25 };
            
            // Simulate travel cost
            testState.energyCells -= 5;
            
            // Simulate reward
            testState.dataChips += 20;
            
            if (testState.energyCells === 20 && testState.dataChips === 70) {
                document.getElementById('resource-test').innerHTML = '<span class="pass">✓ Resource management working</span>';
                document.getElementById('resource-test').innerHTML += '<br>After travel: ' + testState.energyCells + ' energy cells';
                document.getElementById('resource-test').innerHTML += '<br>After reward: ' + testState.dataChips + ' data chips';
            } else {
                document.getElementById('resource-test').innerHTML = '<span class="fail">✗ Resource calculations incorrect</span>';
            }
        } catch (e) {
            document.getElementById('resource-test').innerHTML = '<span class="fail">✗ Resource management failed: ' + e.message + '</span>';
        }
        
        // Test terminal effects
        try {
            // Test CSS effects
            const testDiv = document.createElement('div');
            testDiv.style.cssText = 'color: #00FF00; text-shadow: 0 0 10px #00FF00;';
            
            if (testDiv.style.color === 'rgb(0, 255, 0)') {
                document.getElementById('effects-test').innerHTML = '<span class="pass">✓ Terminal styling working</span>';
                document.getElementById('effects-test').innerHTML += '<br>Green text color applied correctly';
            } else {
                document.getElementById('effects-test').innerHTML = '<span class="fail">✗ Terminal styling failed</span>';
            }
        } catch (e) {
            document.getElementById('effects-test').innerHTML = '<span class="fail">✗ Terminal effects failed: ' + e.message + '</span>';
        }
        
        // Test command system
        try {
            const commands = ['HELP', 'TRAVEL', 'REST', 'STATUS', 'INVENTORY', 'SAVE', 'LOAD'];
            let commandTest = true;
            
            // Test command recognition
            const testCommands = ['help', 'TRAVEL', 'Rest', 'STATUS', 'inventory'];
            testCommands.forEach(cmd => {
                if (!commands.includes(cmd.toUpperCase()) && cmd.toUpperCase() !== cmd) {
                    commandTest = false;
                }
            });
            
            if (commandTest) {
                document.getElementById('commands-test').innerHTML = '<span class="pass">✓ Command system working</span>';
                document.getElementById('commands-test').innerHTML += '<br>Commands recognized: ' + commands.join(', ');
            } else {
                document.getElementById('commands-test').innerHTML = '<span class="fail">✗ Command system issues</span>';
            }
        } catch (e) {
            document.getElementById('commands-test').innerHTML = '<span class="fail">✗ Command system failed: ' + e.message + '</span>';
        }
        
        // Overall test result
        const results = document.querySelectorAll('.pass, .fail');
        let passCount = 0;
        results.forEach(result => {
            if (result.className === 'pass') passCount++;
        });
        
        const overallResult = document.createElement('div');
        overallResult.className = 'test-result';
        overallResult.innerHTML = `
            <h3>Overall Test Result</h3>
            <p class="${passCount >= 3 ? 'pass' : 'fail'}">
                ${passCount}/4 tests passed
                ${passCount >= 3 ? ' - Game ready for deployment!' : ' - Issues need to be addressed'}
            </p>
        `;
        document.body.appendChild(overallResult);
    </script>
</body>
</html>
